<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notes</title>
    <style>
        :root {
            --apple-yellow: #ffcc00;
            --note-bg: #ffffff;
            --text-dark: #000000;
            --gray-text: #8e8e93;
            --bar-bg: #f2f2f7;
            --border-light: #d1d1d6;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--note-bg);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100%;
            overflow: hidden;
        }
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background-color: var(--note-bg);
        }
        .back-btn {
            color: var(--apple-yellow);
            font-size: 1.4rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .right-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .apple-icon {
            width: 22px;
            height: 22px;
            color: var(--apple-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .apple-icon.done {
            background-color: var(--apple-yellow);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .note-canvas {
            flex: 1;
            padding: 16px 20px;
            font-size: 1.15rem;
            line-height: 1.4;
            outline: none;
            overflow-y: auto;
            position: relative;
            white-space: pre-wrap;
            caret-color: var(--apple-yellow);
        }
        .note-canvas:empty::before {
            content: '';
            display: inline-block;
        }
        .stealth-feed {
            margin-top: 40px;
            border-top: 1px solid transparent;
            padding-top: 10px;
            color: var(--gray-text);
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }
        .match-badge {
            display: inline-block;
            background-color: #f2f2f7;
            color: #555555;
            padding: 4px 10px;
            border-radius: 6px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            text-transform: capitalize;
        }
        .apple-toolbar {
            background-color: var(--bar-bg);
            border-top: 1px solid var(--border-light);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
        .toolbar-btn {
            font-size: 1.25rem;
            color: #444444;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
<div class="app-layout">
    <div class="header-actions">
        <div class="back-btn">&#10094;</div>
        <div class="right-icons">
            <div class="apple-icon">&#8679;</div>
            <div class="apple-icon">&#8943;</div>
            <div class="apple-icon done">&#10003;</div>
        </div>
    </div>

    <div class="note-canvas" id="notePad" contenteditable="true" autofocus></div>

    <div class="apple-toolbar">
        <div class="toolbar-btn" style="font-family: serif; font-weight: bold;">Aa</div>
        <div class="toolbar-btn">&#9745;</div>
        <div class="toolbar-btn">&#8862;</div>
        <div class="toolbar-btn">&#128206;</div>
        <div class="toolbar-btn">&#9998;</div>

function findCategoryData(word) {
    word = word.toLowerCase().trim();
    let matches = [];
    for (const [cat, words] of Object.entries(KNOWLEDGE_BASE)) {
        if (words.includes(word) || words.some(w => w+'s'===word || word+'s'===w)) {
            matches.push(cat);
        }
    }
    return {
        primary: matches.length > 0 ? matches : null,
        allMatches: matches
    };
}

const notepad = document.getElementById('notePad');

notepad.addEventListener('input', function() {
    let rawText = notepad.innerText || notepad.textContent || "";
    const logSplit = rawText.split("\n\nMatches:");
    let clearInput = logSplit.trim();
    let tokens = clearInput.toLowerCase().split(/\s+/);
    
    if (tokens.length >= 3) {
        let catWord = tokens;
        let l1 = tokens;
        let l2 = tokens;
        
        let catData = findCategoryData(catWord);
        let cat = catData.primary;
        
        if (cat && l1.length === 1 && l2.length === 1) {
            let filtered = KNOWLEDGE_BASE[cat].filter(w => {
                let lw = w.toLowerCase();
                return lw.startsWith(l1) && lw.charAt(1) === l2;
            });
            
            let resultHTML = clearInput + "\n\nMatches:\n";
            if (filtered.length === 0) {
                resultHTML += "No matching item records.";
            } else {
                filtered.forEach(w => {
                    resultHTML += `• ${w}\n`;
                });
            }
            
            let selection = window.getSelection();
            let range = selection.getRangeAt(0);
            let offset = range.startOffset;
            
            notepad.innerText = resultHTML;
            
            let newRange = document.createRange();
            let textNodes = notepad.childNodes;
            if (textNodes.length > 0) {
                let targetOffset = Math.min(offset, clearInput.length);
                newRange.setStart(textNodes, targetOffset);
                newRange.collapse(true);
                selection.removeAllRanges();
                selection.addRange(newRange);
            }
        }
    }
});

document.getElementById('clearTrigger').addEventListener('click', function() {
    notepad.innerText = '';
    notepad.focus();
});
